{% extends 'base.html' %}
{% load static %}
{% block 'main' %}

<div class="container">
    <div class="row mt-2">
        <div class="col-md-4 mt-3 mx-auto shadow p-5">
            <h2 class="mb-3 text-center">User registration</h2>

            
            {% if errmsg %}
            <div class="alert alert-danger">
                {{errmsg}}
            </div>
            {% endif %} 

            {% if success %}
            <div class="alert alert-success">
                {{success}}
            </div>
            {% endif %}

            <form method="post" >
                {% csrf_token %}
                <div class="mb-3">
                    <label for="input1" class="form-label"><strong>Username : </strong></label>
                    <input type="name" class="form-control" id="input1" name="uname" placeholder="name@example.com">
                
                </div>
                <div class="mb-3">
                    <label for="input2" class="form-label"><strong>Password : </strong></label>
                    <input type="password" class="form-control" id="input2" name="upass" placeholder="password">
                </div>
                <div class="mb-3">
                    <label for="input3" class="form-label"><strong>Re-enter password : </strong></label>
                    <input type="password" class="form-control" id="input3" name="ucpass" placeholder="re-enter password">
                </div>
                <div class="mb-3 text-center">
                   <input type="submit" class="btn btn-danger" value="register"><hr>
                   Existing user? <a class="nav-link"href="/login">Login</a>
                </div>
                
           

            </form>
        </div>

    </div>
    .
</div>
{% endblock 'main' %}
